name: Feature request
description: Suggest something new.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where this would help.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you want it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have already tried?

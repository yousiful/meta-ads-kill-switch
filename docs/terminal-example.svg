  <text x="30" y="340" fill="#8f9bc4" font-size="13">  would pause: [campaign] Retargeting - Video 3  --  $62.18 lifetime spend, 0 results (limit $50)</text>
  <text x="30" y="358" fill="#8f9bc4" font-size="13">  would pause: [adset] Broad - Cold Traffic  --  $53.70 lifetime spend, 0 results (limit $50)</text>

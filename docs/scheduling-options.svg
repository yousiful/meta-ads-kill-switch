<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1100 320" width="1100" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="320" rx="22" fill="url(#bg)"/>
  <text x="550" y="44" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Three ways to schedule the kill switch</text>

  <!-- Panel 1: cron -->
  <rect x="30" y="66" width="320" height="230" rx="14" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <rect x="30" y="66" width="320" height="44" rx="14" fill="#ffd54a"/>
  <rect x="30" y="88" width="320" height="22" fill="#ffd54a"/>
  <text x="190" y="96" text-anchor="middle" fill="#0b1020" font-size="15" font-weight="700">Mac / Linux — cron</text>
  <text x="50" y="134" fill="#8f9bc4" font-size="12" font-family="Consolas, Courier New, monospace">crontab -e</text>
  <text x="50" y="158" fill="#c9d1e8" font-size="12" font-family="Consolas, Courier New, monospace"># every 30 minutes</text>
  <text x="50" y="178" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">*/30 * * * * cd /path/to/repo</text>
  <text x="50" y="196" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">  &amp;&amp; python kill_switch.py --apply</text>
  <text x="50" y="216" fill="#8f9bc4" font-size="11" font-family="Consolas, Courier New, monospace">  &gt;&gt; ~/kill_switch.log 2&gt;&amp;1</text>
  <text x="50" y="250" fill="#8f9bc4" font-size="12">Runs every 30 min. Output</text>
  <text x="50" y="268" fill="#8f9bc4" font-size="12">goes to ~/kill_switch.log</text>

  <!-- Panel 2: Windows Task Scheduler -->
  <rect x="390" y="66" width="320" height="230" rx="14" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <rect x="390" y="66" width="320" height="44" rx="14" fill="#ffd54a"/>
  <rect x="390" y="88" width="320" height="22" fill="#ffd54a"/>
  <text x="550" y="96" text-anchor="middle" fill="#0b1020" font-size="15" font-weight="700">Windows Task Scheduler</text>
  <text x="410" y="134" fill="#c9d1e8" font-size="12" font-family="Consolas, Courier New, monospace">schtasks /create /sc minute /mo 30</text>
  <text x="410" y="154" fill="#c9d1e8" font-size="12" font-family="Consolas, Courier New, monospace">  /tn "Meta Kill Switch"</text>
  <text x="410" y="174" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">  /tr "pythonw C:\repo\kill_switch.py</text>
  <text x="410" y="192" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">        --apply"</text>
  <text x="410" y="212" fill="#c9d1e8" font-size="12" font-family="Consolas, Courier New, monospace">  /st 00:00 /f</text>
  <text x="410" y="250" fill="#8f9bc4" font-size="12">Use pythonw.exe to run</text>
  <text x="410" y="268" fill="#8f9bc4" font-size="12">without a console window.</text>

  <!-- Panel 3: GitHub Actions -->
  <rect x="750" y="66" width="320" height="230" rx="14" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <rect x="750" y="66" width="320" height="44" rx="14" fill="#ffd54a"/>
  <rect x="750" y="88" width="320" height="22" fill="#ffd54a"/>
  <text x="910" y="96" text-anchor="middle" fill="#0b1020" font-size="15" font-weight="700">GitHub Actions</text>
  <text x="770" y="130" fill="#c9d1e8" font-size="12">1. Add repo secrets:</text>
  <text x="770" y="150" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">META_ACCESS_TOKEN</text>
  <text x="770" y="168" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">META_AD_ACCOUNT_ID</text>
  <text x="770" y="192" fill="#c9d1e8" font-size="12">2. Add repo variable to pause live:</text>
  <text x="770" y="212" fill="#44cc77" font-size="11" font-family="Consolas, Courier New, monospace">APPLY = true</text>
  <text x="770" y="236" fill="#c9d1e8" font-size="12">3. Push — workflow runs every 30 min.</text>
  <text x="770" y="268" fill="#8f9bc4" font-size="12">Dry run by default for safety.</text>
</svg>

  <text x="135" y="203" fill="#c9d1e8" font-size="13">Retargeting - Video 3</text>
  <text x="560" y="203" fill="#ff6666" font-size="13">62.18</text>
  <text x="666" y="203" fill="#ff6666" font-size="13">0</text>
  <text x="762" y="203" fill="#ff4444" font-size="13" font-weight="700">PAUSE</text>


  <text x="560" y="230" fill="#c9d1e8" font-size="13">19.50</text>
  <text x="666" y="230" fill="#c9d1e8" font-size="13">1</text>
  <text x="762" y="230" fill="#c9d1e8" font-size="13">keep</text>

  <!-- PAUSE row 2 -->

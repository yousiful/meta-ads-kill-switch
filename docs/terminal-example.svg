  <text x="30" y="257" fill="#8f9bc4" font-size="13">adset</text>
  <text x="135" y="257" fill="#c9d1e8" font-size="13">Broad - Cold Traffic</text>
  <text x="560" y="257" fill="#ff6666" font-size="13">53.70</text>
  <text x="666" y="257" fill="#ff6666" font-size="13">0</text>
  <text x="762" y="257" fill="#ff4444" font-size="13" font-weight="700">PAUSE</text>

